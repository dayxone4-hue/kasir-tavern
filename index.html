async function H(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function modal(h){$('#mb').innerHTML=h;$('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none';$('#mb').innerHTML=''}
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const inR=t=>t>=new Date(S.from+'T00:00:00').getTime()&&t<=new Date(S.to+'T23:59:59.999').getTime();
const used=(id,list=S.tx)=>list.reduce((a,t)=>a+((t.usage||{})[id]||0),0);
const stock=id=>S.mv.filter(m=>m.ingId==id).reduce((a,m)=>a+m.delta,0)-used(id);
function report(){const end=new Date(S.to+'T23:59:59.999').getTime();
 return S.ing.map(g=>{const tx=S.tx.filter(t=>inR(t.ts)),after=S.tx.filter(t=>t.ts>end),mva=S.mv.filter(m=>m.ingId==g.id&&m.ts>end).reduce((a,m)=>a+m.delta,0);
  const u=used(g.id,tx),cups=tx.reduce((a,t)=>a+((t.cups||{})[g.id]||0),0),sisa=stock(g.id)-mva+used(g.id,after);
  return{name:g.name,cat:g.cat,unit:g.unit,std:g.std,awal:sisa+u,cups,u,sisa}}).sort((a,b)=>a.name.localeCompare(b.name))}
function mk(){const items=[],usage={},cups={};let total=0;
 for(const[id,q]of Object.entries(S.cart)){const m=S.menu.find(x=>x.id==id);if(!m)continue;items.push({id,name:m.name,price:m.price,qty:q});total+=m.price*q;
  for(const r of m.recipe||[]){usage[r.ingId]=(usage[r.ingId]||0)+r.qty*q;cups[r.ingId]=(cups[r.ingId]||0)+q}}
 return{items,usage,cups,total}}
const guard=f=>async(...a)=>{if(busy)return;busy=true;const el=a[a.length-1],cl=el&&el.classList;cl&&cl.add('ld');try{await f(...a)}catch(e){toast('Gagal: '+(e.message||e.code||e))}cl&&cl.remove('ld');busy=false};
const msg=t=>{const e=$('#lm');if(e)e.textContent=t};

function loginView(){const up=S.mode=='up';$('#app').innerHTML=`<div class="box"><h2>Kasir Coffee Tavern</h2>
<div class="row"><button class="${up?'':'pri'}" data-a="mode" data-v="in">Masuk</button><button class="${up?'pri':''}" data-a="mode" data-v="up">Daftar akun</button></div>
<label>Username</label><input id="u" autocomplete="username" autocapitalize="none"><label>PIN${up?' (4-8 angka)':''}</label><input id="p" type="password" inputmode="numeric" autocomplete="off">
${up?'<label>Kode verifikasi dari Tavern</label><input id="c" autocomplete="off">':''}
<p id="lm" class="er"></p><button class="pri" style="width:100%" data-a="${up?'reg':'login'}">${up?'Daftar':'Masuk'}</button></div>`}
async function enter(acc){S.me=acc;ls('tv_user',acc.username);remember(acc.username);if(!S.subd){S.subd=true;const sub=(n,k)=>S.db.collection(n).onSnapshot(s=>{S[k]=s.docs.map(x=>({id:x.id,...x.data()}));(S.loaded=S.loaded||{})[k]=1;if(k=='tx'){S.txSrv=S[k];mergeTx()}draw()},()=>toast('Gagal sinkron: '+n));sub('ingredients','ing');sub('menu','menu');sub('transactions','tx');sub('stockmoves','mv');sub('activity','act');sub('closings','cl')}draw()}

const PG={
kasir(){const t=mk(),ls_=Object.entries(S.cart).filter(([id])=>S.menu.some(m=>m.id==id));
 return`<div class="g2"><section><h3>Menu</h3><input id="sq2" placeholder="Cari menu..." value="${E(S.q||'')}" autocomplete="off"><div class="chips">${['','KOPI','NON-KOPI','MAKANAN'].map(c=>`<button class="chip ${(S.mc||'')==c?'on':''}" data-a="mc" data-v="${c}">${c||'Semua'}</button>`).join('')}</div><div class="grid" id="mg">${mgrid()}</div></section>

<div class="tot"><span>Total</span><b>${rp(t.total)}</b></div><div class="row"><button class="pri" data-a="pay" ${t.total?'':'disabled'}>Bayar</button><button data-a="clr">Kosongkan</button></div></section></div>`},
riwayat(){const l=S.tx.filter(t=>inR(t.ts)).sort((a,b)=>b.ts-a.ts),sm=m=>l.filter(t=>!m||t.method==m).reduce((a,t)=>a+t.total,0);
 return`${rng()}<div class="row"><div class="card">Total masuk<div class="big">${rp(sm())}</div></div><div class="card">Tunai<div class="big">${rp(sm('tunai'))}</div></div><div class="card">QRIS<div class="big">${rp(sm('qris'))}</div></div><div class="card">Transaksi<div class="big">${l.length}</div></div></div>

menu(){return`<div class="row"><h3>Menu</h3><button class="pri n" data-a="mf" data-v="">+ Tambah menu</button><button class="n" data-a="mff">+ Tambah makanan</button></div>${S.menu.map(m=>`<div class="card"><div class="row"><b>${E(m.name)} - ${rp(m.price)}</b><span class="n bt b2"><button data-a="mf" data-v="${m.id}">Edit</button> <button class="adm" data-a="mdel" data-v="${m.id}">Hapus</button></span></div><div class="mu">${(m.recipe||[]).map(r=>{const g=S.ing.find(x=>x.id==r.ingId);return g?E(g.name)+' '+r.qty+' '+E(g.unit):'(bahan dihapus)'}).join(', ')||'Tanpa bahan'}</div><div class="mu">${m.cat=='MAKANAN'?'MAKANAN | tanpa bahan':E(m.cat||'-')+' | HPP '+rp(hpp(m))+' | Laba '+rp(m.price-hpp(m))+' ('+(m.price?Math.round((m.price-hpp(m))/m.price*100):0)+'%)'}</div></div>`).join('')||'<p class="mu">Menu masih kosong.</p>'}`},
bahan(){return`<div class="row"><h3>Bahan</h3><button class="pri n" data-a="gf" data-v="">+ Tambah bahan</button></div>${S.ing.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(g=>{const s=stock(g.id);return`<div class="card"><div class="row"><div><b>${E(g.name)}</b> <span class="mu">${E(g.cat)}</span><br>Stok: <b class="${s<0||(g.min&&s<=g.min)?'er':''}">${num(s)} ${E(g.unit)}</b>${g.min&&s<=g.min?' <span class="er">Menipis (min '+g.min+')</span>':''} <span class="mu">(takaran standar ${g.std} ${E(g.stdUnit||g.unit)}/cup)</span></div><span class="n bt"><button class="adm" data-a="stk" data-v="${g.id}">Stok</button> <button data-a="gf" data-v="${g.id}">Info</button> <button class="adm" data-a="gdel" data-v="${g.id}">Hapus</button></span></div></div>`}).join('')||'<p class="mu">Bahan masih kosong.</p>'}`},
laporan(){const r=report();return`${rng()}<button class="pri" data-a="xls">Unduh Excel pemakaian bahan</button><div class="sc"><table><tr>${HD.map(h=>`<th>${h}</th>`).join('')}</tr>${r.map(x=>`<tr><td>${E(x.name)} (${E(x.cat)})</td><td>${num(x.awal)}</td><td>${x.std?num(x.awal/x.std):0}</td><td>${x.std}</td><td>${x.cups}</td><td>${num(x.u)}</td><td>${num(x.sisa)}</td><td>${x.std?num(x.sisa/x.std):0}</td><td>${x.awal?Math.round(x.u/x.awal*100):0}%</td></tr>`).join('')||'<tr><td colspan="9" class="mu">Belum ada bahan.</td></tr>'}</table></div>`}};
